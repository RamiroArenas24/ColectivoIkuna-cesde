spring:
  application:
    name: ikuna-backend

  # CONFIGURACIÓN BASE DE DATOS
  datasource:
    # 1. Corregido el nombre de la DB de 'ikuna2' a 'ikuna' (según tu foto)
    # 2. Si estás en local, intenta usar 'localhost' en vez de la IP específica para evitar problemas de ruteo,
    #    a menos que sea una IP obligatoria de tu red.
    url: jdbc:mysql://localhost:3307/ikuna
    username: ikuna
    password: ${DATABASE_PASSWORD:ikuna123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000

  # JPA & HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # IMPORTANTE: Eliminamos la línea 'dialect' específica.
        # Hibernate detectará que es MySQL automáticamente.
        # Si insiste en pedir uno, usa: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

ikuna:
  security:
    jwt-secret: ${JWT_SECRET:UnaClaveSuperSecretaParaFirmarLosTokensDelColectivoIkuna2024}
    jwt-expiration-ms: 86400000

cors:
  allowed-origins:
    - "http://localhost:5173" # Es mejor ser específico que usar "*" si usas allow-credentials: true
    - "http://localhost:3000"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true

server:
  port: 8080