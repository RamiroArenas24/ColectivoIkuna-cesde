spring:
  application:
    name: ikuna-backend

  jackson:
    default-property-inclusion: always
    # Esto ayuda a que las fechas (LocalDate) se vean bien en el JSON
    serialization:
      write-dates-as-timestamps: false

  # CONFIGURACIÓN BASE DE DATOS (MySQL)
  datasource:
    # Si usas Docker o Localhost, asegúrate de crear la DB 'ikuna_db' primero
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ikuna_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}  # Cambia 'root' si tu usuario es 'ikuna'
    password: ${DATABASE_PASSWORD:root}  # Pon tu contraseña local aquí
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: ${DB_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:600000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

  # JPA & HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update # Crea/Actualiza las tablas (ikuna_projects, ikuna_admins) automáticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # MIGRACIONES (Desactivado por ahora para desarrollo rápido)
  flyway:
    enabled: false

# CONFIGURACIÓN PERSONALIZADA IKUNA (Para tu JWT)
ikuna:
  security:
    jwt-secret: ${JWT_SECRET:UnaClaveSuperSecretaParaFirmarLosTokensDelColectivoIkuna2024}
    jwt-expiration-ms: 86400000 # 24 horas

# CONFIGURACIÓN CORS (Para que React pueda conectarse)
cors:
  allowed-origins:
   - "*"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# SERVIDOR
server:
  port: ${APPLICATION_PORT:8080} # Estandarizado a 8080 para coincidir con tus fetch()
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 100
    connection-timeout: 20000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml,text/plain